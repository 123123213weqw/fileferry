name: CI

# 守住这些曾经真实出过事的事：
#   1. 依赖漏声明导致干净克隆编不出来（f808635）
#   2. 代码能过编译但测试不过
#   3. 平台回归：本地 Mac 开发，Linux 服务器部署——两端都要绿
#    （曾实锤：dd 小写后缀仅 BSD 认、stat -f 仅 BSD、UDP 缓冲行为差异）
#   4. 链路级冒烟与压测：单测进程内测不出的协议错位/死锁
#    （曾实锤：迟到流握手错位卡 10 分钟、saveProgress 并发 map 崩溃）
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  build:
    name: 构建 / 静态检查（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 依赖版本
        run: go version

      - name: go.mod / go.sum 与代码保持一致
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::go.mod/go.sum 与代码不同步，请在本地执行 'go mod tidy' 并提交结果"
            exit 1
          fi

      - name: 构建（依赖缺失即失败）
        run: CGO_ENABLED=0 GOFLAGS=-mod=readonly go build ./...

      - name: 校验已下载模块的校验和
        run: go mod verify

      - name: go vet
        run: GOFLAGS=-mod=readonly go vet ./...

      - name: make build
        run: make build

      - name: 产物存在
        run: |
          for b in ff-controller ff-agent ffctl; do
            test -x "bin/$b" || { echo "::error::缺少产物 bin/$b"; exit 1; }
          done
          ls -l bin/

  test:
    name: 单元测试·race（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go test（含竞态检测）
        run: CGO_ENABLED=1 go test -race -count=1 ./...

  e2e:
    name: 端到端冒烟（Linux）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 构建
        run: make build

      # 全链路：enroll→心跳→探测建边→单文件→目录递归（权限/mtime 校验）
      # 失败即门禁红：协议错位/死锁在这里暴露，单测进程内测不出
      - name: e2e 冒烟（controller + 2 agent + 传输 + 哈希/属性校验）
        run: |
          sudo sysctl -w net.core.rmem_max=7500000 net.core.wmem_max=7500000 || true
          ./scripts/local-e2e.sh

  stress:
    name: 压测四阶段（Linux，1/4 规模）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 构建
        run: make build

      # 5×25MB 并发 / 256MB 大文件 / 5×1.25MB 风暴 / kill -9 中断续传
      # 全程哈希校验；任一阶段失败或哈希不一致即红
      - name: 压测（SIZE_SCALE=0.25）
        run: |
          sudo sysctl -w net.core.rmem_max=7500000 net.core.wmem_max=7500000 || true
          PORT_BASE=21200 SIZE_SCALE=0.25 ./scripts/stress-local.sh
